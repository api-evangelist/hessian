aid: hessian
name: Hessian
description: >-
  Hessian is a Y Combinator (Spring 2026) startup building a forward-deployed AI
  agent platform for automating business operations. Its engineers embed on-site
  to map real workflows, then build and operate custom AI agents on the Hessian
  platform to run those processes end-to-end — spanning sales proposals, financial
  reconciliation, data management, and internal-system synchronization. The
  platform surfaces workflows, task and agent orchestration, workers, queue
  groups, prompts, assets, artifacts, secrets, webhooks, and audit logging, with
  integrations for tools such as GitHub, Slack, Postgres, AWS, Docker, Kubernetes,
  OpenAI, and Claude. Hessian does not yet publish a public API, developer
  documentation, SDKs, or an OpenAPI definition; this profile captures its
  verifiable public identity and web properties while the developer surface is
  awaiting release.
